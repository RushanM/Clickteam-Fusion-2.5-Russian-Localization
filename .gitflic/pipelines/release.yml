name: Выпуск

on:
  manual:
    inputs:
      release_type:
        description: 'Ветка выпуска'
        required: true
        default: 'beta'
        type: choice
        options: 'beta', 'release'
  pull_request:
    paths:
      - 'ru-ru/**'
  push:
    paths:
      - 'ru-ru/**'

variables:
  REPO_NAME: $GITFLIC_REPO_FULL_NAME
  COMMON_DIR: ru-ru/common
  STRICT_DIR: ru-ru/strict
  COMFORT_DIR: ru-ru/comfort

jobs:
  release:
    image: ubuntu:latest
    steps:
      - name: Клонирование репозитория
        script: |
          git clone $GITFLIC_REPO_URL .
          git fetch --tags
          git checkout $GITFLIC_REF

      - name: Установка ветки выпуска
        script: |
          if [[ "$GITFLIC_EVENT_TYPE" == "push" && "$GITFLIC_REF_NAME" == "main" ]]; then
            echo "release_type=beta" >> $GITFLIC_ENV
          elif [[ "$GITFLIC_EVENT_TYPE" == "manual" ]]; then
            echo "release_type=$RELEASE_TYPE" >> $GITFLIC_ENV
          else
            echo "release_type=beta" >> $GITFLIC_ENV
          fi
          cat $GITFLIC_ENV

      - name: Определение следующей релизной версии
        script: |
          last_release_tag=$(git tag --list | grep -E '^[0-9]+$' | sort -V | tail -n 1)
          
          if [ -z "$last_release_tag" ]; then
            echo "last_release_tag=0" >> $GITFLIC_ENV
          else
            echo "last_release_tag=$last_release_tag" >> $GITFLIC_ENV
          fi
          
          next_release_number=$(($last_release_tag + 1))
          echo "next_release_number=$next_release_number" >> $GITFLIC_ENV

      - name: Определение следующего тега
        script: |
          if [[ "$release_type" == "beta" ]]; then
            base_release_number=$next_release_number
            existing_beta_tags=$(git tag --list "${base_release_number}-B*")
            
            if [ -z "$existing_beta_tags" ]; then
              beta_number=1
            else
              max_beta=$(echo "$existing_beta_tags" | sed -E "s/${base_release_number}-B([0-9]+)/\1/" | sort -n | tail -n1)
              beta_number=$((max_beta + 1))
            fi
            
            echo "next_tag=${base_release_number}-B${beta_number}" >> $GITFLIC_ENV
          else
            echo "next_tag=$next_release_number" >> $GITFLIC_ENV
          fi

      - name: Проверка существующего выпуска
        env:
          GITFLIC_TOKEN: $GITFLIC_TOKEN
        script: |
          tag="$next_tag"
          release_exists=$(gitflic-cli release list | grep -w "$tag" || echo "not_found")
          
          if [[ "$release_exists" != "not_found" ]]; then
            if [[ "$release_type" == "beta" ]]; then
              IFS='-' read -r base release_num <<< "$tag"
              beta_num=$(echo "$release_num" | sed -E "s/B([0-9]+)/\1/")
              new_beta_num=$((beta_num + 1))
              echo "new_tag=${base}-B${new_beta_num}" >> $GITFLIC_ENV
            else
              echo "new_tag=$((tag + 1))" >> $GITFLIC_ENV
            fi
          fi

      - name: Повторная проверка тега
        if: $new_tag != ''
        script: |
          tag="$new_tag"
          release_exists=$(gitflic-cli release list | grep -w "$tag" || echo "not_found")
          
          if [[ "$release_exists" != "not_found" ]]; then
            if [[ "$release_type" == "beta" ]]; then
              IFS='-' read -r base release_num <<< "$tag"
              beta_num=$(echo "$release_num" | sed -E "s/B([0-9]+)/\1/")
              echo "new_tag=${base}-B$((beta_num + 1))" >> $GITFLIC_ENV
            else
              echo "new_tag=$((tag + 1))" >> $GITFLIC_ENV
            fi
          fi

      - name: Установка окончательного тега
        script: |
          if [ -n "$new_tag" ]; then
            echo "final_tag=$new_tag" >> $GITFLIC_ENV
          else
            echo "final_tag=$next_tag" >> $GITFLIC_ENV
          fi
          echo "Final tag: $final_tag"

      - name: Формирование названия выпуска
        script: |
          if [[ "$release_type" == "beta" ]]; then
            if [[ "$final_tag" =~ ^([0-9]+)-B([0-9]+)$ ]]; then
              base_release=${BASH_REMATCH[1]}
              beta_num=${BASH_REMATCH[2]}
              release_name="${beta_num}-я бета ${base_release}-го релиза"
            else
              release_name="${final_tag}-й бета-выпуск"
            fi
          else
            release_name="${final_tag}-й релиз"
          fi
          echo "release_name=${release_name}" >> $GITFLIC_ENV

      - name: Создание временных каталогов
        script: |
          mkdir -p temp/strict/ru-ru
          mkdir -p temp/comfort/ru-ru

      - name: Подготовка архива строгой локализации
        script: |
          cp -r "$STRICT_DIR"/* temp/strict/ru-ru/
          cp -r "$COMMON_DIR"/* temp/strict/ru-ru/

      - name: Подготовка архива удобной локализации
        script: |
          cp -r "$COMFORT_DIR"/* temp/comfort/ru-ru/
          cp -r "$COMMON_DIR"/* temp/comfort/ru-ru/

      - name: Архивация вариантов
        script: |
          strict_archive="CF2.5_ru-RU_${final_tag}_Strict.zip"
          comfort_archive="CF2.5_ru-RU_${final_tag}_Comfort.zip"
          
          cd temp/strict && zip -r "../../${strict_archive}" * && cd ../..
          cd temp/comfort && zip -r "../../${comfort_archive}" * && cd ../..
          
          echo "strict_archive=${strict_archive}" >> $GITFLIC_ENV
          echo "comfort_archive=${comfort_archive}" >> $GITFLIC_ENV

      - name: Создание выпуска
        env:
          GITFLIC_TOKEN: $GITFLIC_TOKEN
        script: |
          gitflic-cli release create \
            --tag "$final_tag" \
            --name "$release_name" \
            --description "Автоматический $([ "$release_type" = "beta" ] && echo "бета-")выпуск.\n\nДоступно два варианта локализации:\n* строгая (strict) — более строгий перевод,\n* удобная (comfort) — адаптированный перевод." \
            --prerelease $([ "$release_type" = "beta" ] && echo "true" || echo "false") \
            --artifacts "$strict_archive" "$comfort_archive"
