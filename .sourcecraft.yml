pipeline:
  release:
    triggers:
      - manual:
          parameters:
            release_type:
              type: choice
              options: ['beta', 'release']
              default: 'beta'
      - git:
          events: [push, pull_request]
          paths: ['ru-ru/**']
    
    environment:
      variables:
        REPO_NAME: ${SC_REPO_FULL_NAME}
        COMMON_DIR: ru-ru/common
        STRICT_DIR: ru-ru/strict
        COMFORT_DIR: ru-ru/comfort
    
    image: ubuntu:latest
    
    steps:
      - checkout
      
      - script: |
          if [[ "${SC_EVENT}" == "push" && "${SC_BRANCH}" == "main" ]]; then
            export RELEASE_TYPE=beta
          elif [[ "${SC_EVENT}" == "manual" ]]; then
            export RELEASE_TYPE=${INPUT_RELEASE_TYPE}
          else
            export RELEASE_TYPE=beta
          fi
          echo "RELEASE_TYPE=${RELEASE_TYPE}" >> ${SC_ENV_FILE}
      
      - script: |
          last_release_tag=$(git tag --list | grep -E '^[0-9]+$' | sort -V | tail -n1)
          [ -z "$last_release_tag" ] && last_release_tag=0
          next_release_number=$((last_release_tag + 1))
          echo "NEXT_RELEASE_NUMBER=${next_release_number}" >> ${SC_ENV_FILE}
      
      - script: |
          if [[ "$RELEASE_TYPE" == "beta" ]]; then
            base=${NEXT_RELEASE_NUMBER}
            existing_beta_tags=$(git tag --list "${base}-B*")
            beta_num=$([ -z "$existing_beta_tags" ] && echo 1 || echo $(($(echo "$existing_beta_tags" | sed -E "s/${base}-B([0-9]+)/\1/" | sort -n | tail -n1)+1)))
            echo "NEXT_TAG=${base}-B${beta_num}" >> ${SC_ENV_FILE}
          else
            echo "NEXT_TAG=${NEXT_RELEASE_NUMBER}" >> ${SC_ENV_FILE}
          fi
      
      - script: |
          tag="${NEXT_TAG}"
          release_exists=$(sourcecraft-tool releases list | grep -w "$tag" || echo "not_found")
          if [[ "$release_exists" != "not_found" ]]; then
            if [[ "$RELEASE_TYPE" == "beta" ]]; then
              IFS='-' read -r base num <<< "$tag"
              beta_num=$(echo "$num" | sed 's/B//')
              echo "NEW_TAG=${base}-B$((beta_num + 1))" >> ${SC_ENV_FILE}
            else
              echo "NEW_TAG=$((tag + 1))" >> ${SC_ENV_FILE}
            fi
          fi
      
      - when: ${NEW_TAG} != ''
        script: |
          tag="${NEW_TAG}"
          release_exists=$(sourcecraft-tool releases list | grep -w "$tag" || echo "not_found")
          if [[ "$release_exists" != "not_found" ]]; then
            if [[ "$RELEASE_TYPE" == "beta" ]]; then
              IFS='-' read -r base num <<< "$tag"
              echo "NEW_TAG=${base}-B$((${num/B/} + 1))" >> ${SC_ENV_FILE}
            else
              echo "NEW_TAG=$((tag + 1))" >> ${SC_ENV_FILE}
            fi
          fi
      
      - script: |
          final_tag=${NEW_TAG:-$NEXT_TAG}
          echo "FINAL_TAG=${final_tag}" >> ${SC_ENV_FILE}
          echo "Final release tag: ${final_tag}"

      - script: |
          if [[ "$RELEASE_TYPE" == "beta" ]]; then
            if [[ "$FINAL_TAG" =~ ^([0-9]+)-B([0-9]+)$ ]]; then
              base_release=${BASH_REMATCH[1]}
              beta_num=${BASH_REMATCH[2]}
              RELEASE_NAME="${beta_num}-я бета ${base_release}-го релиза"
            else
              RELEASE_NAME="${FINAL_TAG}-й бета-выпуск"
            fi
          else
            RELEASE_NAME="${FINAL_TAG}-й релиз"
          fi
          echo "RELEASE_NAME=${RELEASE_NAME}" >> ${SC_ENV_FILE}

      - script: |
          mkdir -p temp/strict/ru-ru
          mkdir -p temp/comfort/ru-ru

      - script: |
          cp -r "${STRICT_DIR}"/* temp/strict/ru-ru/
          cp -r "${COMMON_DIR}"/* temp/strict/ru-ru/

      - script: |
          cp -r "${COMFORT_DIR}"/* temp/comfort/ru-ru/
          cp -r "${COMMON_DIR}"/* temp/comfort/ru-ru/

      - script: |
          strict_archive="CF2.5_ru-RU_${FINAL_TAG}_Strict.zip"
          comfort_archive="CF2.5_ru-RU_${FINAL_TAG}_Comfort.zip"
          
          cd temp/strict && zip -r "../../${strict_archive}" * && cd ../..
          cd temp/comfort && zip -r "../../${comfort_archive}" * && cd ../..
          
          echo "STRICT_ARCHIVE=${strict_archive}" >> ${SC_ENV_FILE}
          echo "COMFORT_ARCHIVE=${comfort_archive}" >> ${SC_ENV_FILE}

      - script: |
          sourcecraft-tool releases create \
            --tag "$FINAL_TAG" \
            --title "$RELEASE_NAME" \
            --notes "Автоматический $([ "$RELEASE_TYPE" = "beta" ] && echo "бета-")выпуск.\n\nВарианты локализации:\n* Strict - точный перевод\n* Comfort - адаптированный" \
            --prerelease $([ "$RELEASE_TYPE" = "beta" ] && echo "true" || echo "false") \
            --attach "$STRICT_ARCHIVE" \
            --attach "$COMFORT_ARCHIVE"
